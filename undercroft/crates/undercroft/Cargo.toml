[package]
name = "undercroft"
description = "The Undercroft: Bevy app (native and wasm)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Native development only: link Bevy dynamically for fast rebuilds. Never on wasm.
dev = ["bevy/dynamic_linking", "bevy/file_watcher"]

[dependencies]
undercroft-data = { workspace = true }
undercroft-sim = { workspace = true }
bevy = { workspace = true }
# The asset loader deserialises zones.ron itself to learn the map file names, and reports its own
# failures as a typed error.
ron = { workspace = true }
thiserror = { workspace = true }
# The audio lane deserialises `assets/audio/manifest.ron` (baked in with `include_str!`).
serde = { workspace = true }

# `SaveStore` on the web is localStorage, exactly what `save.js` used.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true }
